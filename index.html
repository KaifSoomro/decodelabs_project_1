<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/images/hero.webp"
      type="image/x-icon"
    />

    <!-- Style -->
    <link rel="stylesheet" href="css/style.css" />
    <title>Careerly | The Future of Job Search</title>
    <!-- Mobile css -->
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <header class="header_container">
      <nav class="nav_container" aria-label="Main Navigation">
        <div class="nav_logo">
          <img src="/assets/icons/logo.svg" alt="Careerly logo" />
          <h1>Careerly</h1>
        </div>
        <div class="tabs">
          <button id="tab-candidate" class="tab active">Candidate</button>
          <button id="tab-company" class="tab">Company</button>
        </div>
        <div class="nav_btns">
          <select id="lang-select" class="nav_select" aria-label="Select Language">
            <option value="eng">ENG</option>
            <option value="fra">FRA</option>
            <option value="deu">DEU</option>
          </select>
          <button id="nav-login-btn" class="login_btn">Log in</button>
        </div>

        <button id="mobile-menu-toggle" class="mobile_menu" aria-label="Toggle Navigation Menu">
          <img src="/assets/icons/mobile_menu.svg" alt="menu icon" />
        </button>
      </nav>
    </header>

    <main>
      <section class="hero" id="hero-section">
        <img src="/assets/images/hero_2.png" alt="" class="hero_img" />
        <div class="hero_content">
          <img src="/assets/images/hero.webp" alt="" class="top_image_blur" />
          <h1>
            Find the ideal job with <br />
            Careerly
          </h1>

          <div class="hero_cta">
            <div class="cta_content">
              <img src="/assets/icons/search.svg" alt="" />
              <input
                id="search-input"
                type="text"
                placeholder="Profession, position or company"
              />
              <select id="location-select" aria-label="Select Location">
                <option value="europe">Europe</option>
                <option value="americas">Americas</option>
                <option value="asia">Asia</option>
              </select>
            </div>
            <button id="find-vacancies-btn">Find vacancies</button>
          </div>
        </div>
      </section>

      <section id="trust-stats" class="trust_stats">
        <div class="stats_container">
          <div class="stat_item">
            <h2 class="stat_number">12,000+</h2>
            <p class="stat_label">Active Vacancies</p>
          </div>
          <div class="stat_item">
            <h2 class="stat_number">500+</h2>
            <p class="stat_label">Partner Companies</p>
          </div>
          <div class="stat_item">
            <h2 class="stat_number">80k+</h2>
            <p class="stat_label">Monthly Seekers</p>
          </div>
        </div>
        
        <div class="logo_marquee_container">
          <p class="marquee_title">Trusted by industry leaders worldwide</p>
          <div class="logo_marquee">
            <div class="marquee_track">
              <span>Stripe</span>
              <span>Figma</span>
              <span>Vercel</span>
              <span>Linear</span>
              <span>Supabase</span>
              <span>Airbnb</span>
              <span>Netflix</span>
              <span>Slack</span>
              <span>Stripe</span>
              <span>Figma</span>
              <span>Vercel</span>
              <span>Linear</span>
              <span>Supabase</span>
              <span>Airbnb</span>
              <span>Netflix</span>
              <span>Slack</span>
            </div>
          </div>
        </div>
      </section>
  </body>
</html>
