<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="shortcut icon"
      href="/assets/images/hero.webp"
      type="image/x-icon"
    />

    <!-- Style -->
    <link rel="stylesheet" href="css/style.css" />
    <title>Careerly | The Future of Job Search</title>
  </head>
  <body>
    <header>
      <nav class="nav_container">
        <div class="nav_logo">
          <img src="/assets/icons/logo.svg" alt="" />
          <h1>Careerly</h1>
        </div>
        <div>
          <button>Candidate</button>
          <button>Company</button>
        </div>
        <div class="nav_btns">
          <select class="nav_select">
            <option>
              ENG <img src="/assets/icons/arrow_down.svg" alt="" />
            </option>
          </select>
          <button class="login_btn">Log in</button>
        </div>
      </nav>
    </header>

    <main>
      <section class="hero">
        <img src="/assets/images/hero_2.png" alt="" class="hero_img">
        <div class="hero_content">
            <img src="/assets/images/hero.webp" alt="" class="top_image_blur">
          <h1>
            Find the ideal job with <br />
            Careerly
          </h1>

          <div class="hero_cta">
            <div class="cta_content">
                <img src="/assets/icons/search.svg" alt="">
                <input type="text" placeholder="Profession, position or company">
                <select>
                    <option>Europe <img src="/assets/icons/arrow_down.svg" alt=""></option>
                </select>
            </div>
            <button>Find vacancies</button>
          </div>
        </div>

        <div class="popular">
            <h1>Popular categories</h1>
            <div class="popular_card_grid">
                <div class="popular_card">
                    <h1>IT</h1>
                    <p>3826 vacancies</p>
                </div>
                <div class="popular_card">
                    <h1>Marketing</h1>
                    <p>3826 vacancies</p>
                </div>
                <div class="popular_card">
                    <h1>Finance</h1>
                    <p>3826 vacancies</p>
                </div>
                <div class="popular_card">
                    <h1>Remote work</h1>
                    <p>3826 vacancies</p>
                </div>
                <div class="popular_card">
                    <h1>Science</h1>
                    <p>3826 vacancies</p>
                </div>
                <div class="popular_card">
                    <h1>Insurance</h1>
                    <p>3826 vacancies</p>
                </div>
                <div class="popular_card">
                    <h1>Real state</h1>
                    <p>3826 vacancies</p>
                </div>
                <div class="popular_card">
                    <h1>Tourism</h1>
                    <p>3826 vacancies</p>
                </div>
            </div>
            <h3 class="all_vacan_btn">All Vacancies ></h3>
        </div>
      </section>
    </main>
  </body>
</html>
